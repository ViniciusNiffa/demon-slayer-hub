{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block extra_css %} 
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}

{% block content %}
<section id="divLogin" class="auth-container">
    <img src="{{ url_for('static', filename='uploads/pastaBanner/default.png') }}" alt="">
    <h1 class="titulo">Access Hub</h1>
    <form action="{{ url_for('auth.login') }}" method="POST">
        <div id="loginSenha">
            <div class="form-group">
                <input type="email" name="email" id="email" placeholder="E-mail" required>
            </div>
            <div class="form-group">
                <input type="password" name="senha" id="senha" placeholder="Password" required>
                <img id="togglePassword" src="{{ url_for('static', filename='uploads/login/visualizar.png') }}" alt="View Password" onclick="togglePasswordVisibility()">
            </div>
        </div>
        <button type="submit">Login</button>
    </form>
    <p id="insc">Not a member yet? <a href="{{ url_for('auth.cadastro') }}">Sign up</a></p>
</section>
{% endblock %}

{% block extra_js %}
{{ super() }}
{% endblock %}
