{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block extra_css %} 
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}

{% block content %}
<section id="divLogin" class="auth-container">
    <img src="{{ url_for('static', filename='uploads/pastaBanner/default.png') }}" alt="">
    <h1 class="titulo">Acessar Hub</h1>
    <form action="{{ url_for('auth.login') }}" method="POST">
        <div id="loginSenha">
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" name="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <div class="password-wrapper" style="position: relative;">
                    <input type="password" name="senha" id="senha" required style="width: 100%;">
                    <span id="togglePassword" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #ccc;">👁️</span>
                </div>
            </div>
        </div>
        <button type="submit" class="btn-submit">Entrar</button>
    </form>
    <p id="insc">Ainda não é um membro? <a href="{{ url_for('auth.cadastro') }}">Cadastre-se</a></p>
</section>
{% endblock %}

{% block extra_js %}
{{ super() }}
<script>
    // Lógica para mostrar/esconder senha
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#senha');

    togglePassword.addEventListener('click', function (e) {
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        this.textContent = type === 'password' ? '👁️' : '🙈';
    });
</script>
{% endblock %}
