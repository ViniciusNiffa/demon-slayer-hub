<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Demon Slayer Hub | Sign up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='uploads/favicon-16x16.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/reset.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastro.css') }}">
</head>

<body>

        {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div id="flashModal" class="modal-overlay" style="display: block;">
          <div class="modal-content {{ messages[0][0] }}">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            {% for category, message in messages %}
              <p>{{ message }}</p>
            {% endfor %}
            <button class="btn-modal {{ messages[0][0] }}" onclick="closeModal()">Ok</button>
          </div>
        </div>
      {% endif %}
    {% endwith %}

    <a href="{{ url_for('index') }}"><img src="{{ url_for('static', filename='uploads/voltar.png') }} " id="voltar" title="Back" alt="Back"></a>
    
    <section id="cadastro">
        <form id="formCadastro" action="{{ url_for('auth.cadastro') }}" method="POST">
            <h1>User registration</h1>
            <div class="dados">
                <label>User</label>
                <input type="text" name="nome" placeholder="Your slayer name" required>
            </div>

            <div class="dados">
                <label>E-mail</label>
                <input type="email" name="email" placeholder="example@email.com" required>
            </div>

            <div class="dados">
                <label>Password</label>
                <input type="password" name="senha" placeholder="Create a password" required>
            </div>

            <div class="dados">
                <label>Confirm password</label>
                <input type="password" name="confirmar_senha" placeholder="Repeat password" required>
            </div>

            <button type="submit" id="botao">Sign up</button>
        </form>
    </section>
    <script src="{{ url_for('static', filename='js/global.js') }}"></script>
</body>

</html>
